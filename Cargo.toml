[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
compypal-core = { path = "crates/compypal-core" }
compypal-io = { path = "crates/compypal-io" }
compypal-audio = { path = "crates/compypal-audio" }
rinch = { git = "https://github.com/joeleaver/rinch", branch = "main", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
midly = "0.5"
thiserror = "2"

# Mirrors rinch's own [patch] section: rinch builds against these forks,
# and patches don't propagate to dependent workspaces.
[patch.crates-io]
wgpu = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-core = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-hal = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-types = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
naga = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
# Patch winit to use our fork with Wayland DnD support
# Upstream winit 0.31-beta.2 has no Wayland drag-and-drop implementation
winit = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-core = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-common = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-wayland = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-x11 = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
dpi = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }

# Analysis (and later, synthesis) runs on every edit; keep it fast in dev builds.
[profile.dev.package.compypal-core]
opt-level = 2

# The synth renders in the audio callback; unoptimized it can't keep up.
[profile.dev.package.compypal-audio]
opt-level = 3

[profile.dev.package.rustysynth]
opt-level = 3
