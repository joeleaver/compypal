[package]
name = "compypal-audio"
version.workspace = true
edition.workspace = true

[features]
# Audio input through PipeWire, where the sound server owns the cards
# (raw ALSA devices are busy). Needs libpipewire-0.3 headers to build.
default = ["pipewire"]
pipewire = ["cpal/pipewire"]

[dependencies]
compypal-core.workspace = true
cpal = "0.18"
rustysynth = "1.3"
midir = "0.11"
realfft = "3.5"
tract-onnx = "0.23"
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
